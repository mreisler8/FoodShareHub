<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="pizzaGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF8A65;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#FF7043;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF5722;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Pizza slice background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#pizzaGradient)" stroke="#E64A19" stroke-width="2"/>
  
  <!-- Pizza slice shape -->
  <path d="M 50 20 A 25 25 0 0 1 70 65 L 50 50 Z" fill="#FFE0B2" stroke="#FF8A65" stroke-width="1.5"/>
  
  <!-- Pizza toppings (pepperoni dots) -->
  <circle cx="58" cy="35" r="3" fill="#D32F2F"/>
  <circle cx="65" cy="45" r="3" fill="#D32F2F"/>
  <circle cx="60" cy="55" r="3" fill="#D32F2F"/>
  <circle cx="52" cy="42" r="2.5" fill="#D32F2F"/>
  
  <!-- Crust texture line -->
  <path d="M 50 20 A 25 25 0 0 1 70 65" fill="none" stroke="#FFCC02" stroke-width="2" stroke-linecap="round"/>
</svg>