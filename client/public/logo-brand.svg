
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="backgroundGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#FF4500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC3300;stop-opacity:0.8" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="32" cy="32" r="30" fill="url(#backgroundGradient)" stroke="#E55A2B" stroke-width="2"/>
  
  <!-- Pizza slice shape -->
  <g filter="url(#glow)">
    <!-- Main pizza slice -->
    <path d="M32 12 L50 48 L14 48 Z" fill="#FFB366" stroke="#E55A2B" stroke-width="1.5"/>
    
    <!-- Pizza crust -->
    <path d="M14 48 L50 48" stroke="#D4501F" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Pepperoni toppings -->
    <circle cx="26" cy="32" r="3" fill="#C4321A"/>
    <circle cx="38" cy="36" r="3" fill="#C4321A"/>
    <circle cx="32" cy="26" r="2.5" fill="#C4321A"/>
    <circle cx="22" cy="42" r="2.5" fill="#C4321A"/>
    <circle cx="42" cy="42" r="2" fill="#C4321A"/>
    
    <!-- Cheese highlights -->
    <ellipse cx="28" cy="38" rx="3" ry="1.5" fill="#FFD4A3" opacity="0.8"/>
    <ellipse cx="40" cy="44" rx="2.5" ry="1.2" fill="#FFD4A3" opacity="0.8"/>
    <ellipse cx="34" cy="32" rx="2" ry="1" fill="#FFD4A3" opacity="0.7"/>
  </g>
</svg>
